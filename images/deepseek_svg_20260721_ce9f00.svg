<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="162" ry="162"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#DF6B42"/>
      <stop offset="100%" stop-color="#F2B48A"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="rgba(100,40,15,0.3)"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="162" ry="162" fill="url(#bgGrad)" clip-path="url(#squircle)"/>

  <!-- Grain texture (2.5%) -->
  <rect x="0" y="0" width="1024" height="1024" rx="162" ry="162" fill="url(#bgGrad)" clip-path="url(#squircle)" opacity="0.025"/>

  <g filter="url(#shadow)" clip-path="url(#squircle)">
    <!-- Wider arch -->
    <path d="M 340 620 L 340 360 Q 340 270 512 250 Q 684 270 684 360 L 684 620" 
          fill="none" stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Equals bars -->
    <line x1="320" y1="455" x2="704" y2="455" stroke="white" stroke-width="30" stroke-linecap="round" opacity="0.95"/>
    <line x1="320" y1="545" x2="704" y2="545" stroke="white" stroke-width="30" stroke-linecap="round" opacity="0.95"/>
    <!-- Frosted glass fill -->
    <path d="M 340 250 Q 512 230 684 250 L 684 620 L 340 620 Z" fill="url(#glassGrad)"/>
  </g>

  <rect x="0" y="0" width="1024" height="1024" rx="162" ry="162" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="5" clip-path="url(#squircle)"/>
</svg>