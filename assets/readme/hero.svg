<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="title desc">
  <title id="title">GateCalc — macOS-калькулятор</title>
  <desc id="desc">Нативный macOS-калькулятор на Swift 6.0 и SwiftUI с точными вычислениями до 38 значащих цифр.</desc>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C1E"/>
      <stop offset="100%" style="stop-color:#0D0D0F"/>
    </linearGradient>

    <!-- Button shadow -->
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Accent glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip path for rounded container -->
    <clipPath id="containerClip">
      <rect width="1200" height="320" rx="26"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#containerClip)">
    <rect width="1200" height="320" fill="url(#bgGrad)"/>

    <!-- Subtle grid pattern (calculator keyline motif) -->
    <g opacity="0.04">
      <!-- Vertical lines -->
      <path d="M 280,0 L 280,320 M 560,0 L 560,320" stroke="#FFFFFF" stroke-width="1"/>
    </g>

    <!-- Accent diagonal line (top-right) -->
    <path d="M 700,40 L 820,40 L 820,160" fill="none" stroke="#0A84FF" stroke-width="2" opacity="0.3"/>

    <!-- ===== TITLE BLOCK (left side) ===== -->
    <g id="title-block" transform="translate(56 40)">

      <!-- Category label -->
      <rect x="0" y="0" width="128" height="28" rx="6" fill="#0A84FF" opacity="0.12"/>
      <text x="64" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="500" fill="#0A84FF">macOS • Utility</text>

      <!-- Project name -->
      <text x="0" y="72" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">GateCalc</text>

      <!-- Tagline -->
      <text x="0" y="106" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#A1A1A6">Нативный калькулятор на Swift 6.0 и SwiftUI</text>

      <!-- Sub-tagline -->
      <text x="0" y="138" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#636366">Точные вычисления до 38 значащих цифр</text>

      <!-- Divider -->
      <line x1="0" y1="162" x2="480" y2="162" stroke="#2C2C2E" stroke-width="1"/>

      <!-- Metadata row 1: Platform + Engine -->
      <g transform="translate(0,186)">
        <rect x="0" y="-14" width="96" height="28" rx="6" fill="#2C2C2E"/>
        <text x="48" y="5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="500" fill="#A1A1A6">macOS 14+</text>

        <rect x="108" y="-14" width="96" height="28" rx="6" fill="#2C2C2E"/>
        <text x="156" y="5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="500" fill="#A1A1A6">Swift 6.0</text>

        <rect x="216" y="-14" width="96" height="28" rx="6" fill="#2C2C2E"/>
        <text x="264" y="5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="500" fill="#A1A1A6">SwiftUI</text>

        <rect x="324" y="-14" width="96" height="28" rx="6" fill="#2C2C2E"/>
        <text x="372" y="5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="500" fill="#A1A1A6">MVVM</text>
      </g>

    </g>

    <!-- ===== CALCULATOR GRID (right side) ===== -->
    <g id="calculator-proof" transform="translate(720 48)">

      <!-- Display area -->
      <rect x="0" y="0" width="160" height="56" rx="10" fill="#0D0D0F"/>
      <text x="8" y="24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" fill="#A1A1A6">(15 + 25) × (3 − 1)</text>
      <text x="8" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">80</text>

      <!-- Row 1: ( ) clipboard backspace AC -->
      <g transform="translate(0,64)">
        <!-- ( button -->
        <rect x="0" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="14" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">(</text>

        <!-- ) button -->
        <rect x="32" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="46" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">)</text>

        <!-- clipboard button -->
        <rect x="64" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="78" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">⌘</text>

        <!-- backspace button -->
        <rect x="96" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="110" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">⌫</text>

        <!-- AC button -->
        <rect x="128" y="0" width="32" height="28" rx="5" fill="#3A3A3C"/>
        <text x="144" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">AC</text>
      </g>

      <!-- Row 2: MC M+ M- MR ÷ -->
      <g transform="translate(0,98)">
        <!-- MC -->
        <rect x="0" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="14" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">MC</text>

        <!-- M+ -->
        <rect x="32" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="46" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">M+</text>

        <!-- M- -->
        <rect x="64" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="78" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">M−</text>

        <!-- MR -->
        <rect x="96" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="110" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">MR</text>

        <!-- ÷ button (accent) -->
        <rect x="128" y="0" width="32" height="28" rx="5" fill="#0A84FF"/>
        <text x="144" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">÷</text>
      </g>

      <!-- Row 3: % +/- √ x² × -->
      <g transform="translate(0,132)">
        <!-- % -->
        <rect x="0" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="14" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">%</text>

        <!-- +/- -->
        <rect x="32" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="46" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">+/−</text>

        <!-- √ -->
        <rect x="64" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="78" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">√</text>

        <!-- x² -->
        <rect x="96" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="110" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">x²</text>

        <!-- × button (accent) -->
        <rect x="128" y="0" width="32" height="28" rx="5" fill="#0A84FF"/>
        <text x="144" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">×</text>
      </g>

      <!-- Row 4: 6 7 8 9 - -->
      <g transform="translate(0,166)">
        <!-- 6 -->
        <rect x="0" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="14" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">6</text>

        <!-- 7 -->
        <rect x="32" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="46" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">7</text>

        <!-- 8 -->
        <rect x="64" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="78" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">8</text>

        <!-- 9 -->
        <rect x="96" y="0" width="28" height="28" rx="5" fill="#3A3A3C"/>
        <text x="110" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">9</text>

        <!-- - button (accent) -->
        <rect x="128" y="0" width="32" height="28" rx="5" fill="#0A84FF"/>
        <text x="144" y="19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">−</text>
      </g>

    </g>

  </g>

</svg>
